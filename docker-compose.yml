services:
  # ─────────────────────────────────────────────────────────────────────────────
  # POSTGRES — persistent relational store
  # WHY isolated: DB upgrades, backups, and scaling happen independently of app code.
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mizan
    # WHY 127.0.0.1 bind: Postgres must NEVER be reachable from the public internet.
    # Only the host (and other containers via Docker's internal network) need access.
    ports:
      - "127.0.0.1:5434:5432"
    # WHY named volume: data survives `docker compose down`. Anonymous volumes are
    # deleted on `down --volumes`. Named volumes persist until explicitly removed.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # WHY pg_isready: checks TCP + auth without opening a full connection.
      # Faster and lighter than running a SELECT 1 query.
      test: ["CMD-SHELL", "pg_isready -U mizan -d mizan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # REDIS — rate-limiter backing store
  # WHY isolated: rate-limit windows must survive a backend restart and be shared
  # across multiple backend instances; an in-memory limiter can't do either.
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # WHY appendonly: persist the limiter state across container restarts so a
    # restart doesn't reset everyone's window to zero.
    command: ["redis-server", "--appendonly", "yes"]
    # WHY 127.0.0.1 bind: Redis has no auth here and must never be exposed publicly.
    # Containers reach it via the internal Docker network (redis://redis:6379).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND — FastAPI on port 8000
  # WHY isolated: Python deps, hot reload, and DB migrations are backend concerns only.
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    # WHY 127.0.0.1 bind: Nginx proxies to the backend locally on the same host,
    # so the port only needs to be reachable from localhost — not the public internet.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # In-cluster Redis hostname. Overridable via .env if pointed at a managed Redis.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        # WHY condition service_healthy: without this, backend starts before Postgres
        # accepts connections and crashes with "connection refused".
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # WHY volume mount: changes to ./backend reflect instantly in the container.
    # Combined with uvicorn --reload, edits take effect without rebuilding the image.
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND — Next.js on port 3000
  # WHY isolated: Node.js ecosystem, npm, and React builds are entirely separate concerns.
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    # WHY 127.0.0.1 bind: Nginx proxies to the frontend locally on the same host,
    # so the port only needs to be reachable from localhost — not the public internet.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # WHY NEXT_PUBLIC_: This is what the browser uses to reach the backend.
      # The browser runs on the host, not inside Docker, so it uses localhost:8000.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

# WHY top-level volumes: declares the named volume so Docker manages its lifecycle.
# Without this declaration, postgres_data would silently become an anonymous volume.
volumes:
  postgres_data:
  redis_data:
